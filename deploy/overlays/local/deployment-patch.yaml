apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
spec:
  template:
    spec:
      containers:
        - name: demo-service
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: local
            - name: APP_VERSION
              value: local
            - name: LOG_LEVEL
              value: INFO
